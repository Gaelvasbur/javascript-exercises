<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 7: Random Password Generator</title>
    <style>
        .btn-regresar {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: #007BFF;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        .btn-regresar:hover { text-decoration: underline; }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 320px;
            text-align: center;
        }
        input, button {
            padding: 12px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            cursor: pointer;
            background-color: #9b59b6;
            color: white;
            border: none;
            font-weight: bold;
        }
        button:hover { background-color: #8e44ad; }
        
        /* Box to display the final password */
        #password-result {
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #2c3e50;
            padding: 12px;
            background-color: #ecf0f1;
            border-radius: 4px;
            word-break: break-all; 
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-regresar">← Volver al Índice</a>

    <div class="container">
        <h2>Password Generator</h2>
        
        <label for="password-length">Password Length (Min: 4):</label>
        <input type="number" id="password-length" placeholder="Enter length..." min="4">
        
        <button id="btn-generate">Generate Password</button>
        
        <div id="password-result">Your password will appear here</div>
    </div>

    <script src="js_ejercicio7.js"></script>
</body>
</html>
