<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 9: Todo List with LocalStorage</title>
    <style>
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: #007BFF;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        .back-btn:hover { text-decoration: underline; }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 350px;
        }
        h2 {
            text-align: center;
            margin-top: 0;
            color: #2c3e50;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .add-btn {
            background-color: #2ecc71;
            color: white;
        }
        .add-btn:hover { background-color: #27ae60; }
        
        .clear-btn {
            background-color: #e74c3c;
            color: white;
            width: 100%;
        }
        .clear-btn:hover { background-color: #c0392b; }

        .todo-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
            max-height: 250px;
            overflow-y: auto;
        }
        .todo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 5px;
            border-bottom: 1px solid #eee;
        }
        .todo-item.completed span {
            text-decoration: line-through;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Back to Index</a>

    <div class="container">
        <h2>Todo List</h2>
        
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="Add a new task...">
            <button id="add-todo-btn" class="add-btn">Add</button>
        </div>

        <ul id="todo-list" class="todo-list"></ul>

        <button id="clear-completed-btn" class="clear-btn">Clear Completed Tasks</button>
    </div>

    <script src="js_ejercicio9.js"></script>
</body>
</html>
