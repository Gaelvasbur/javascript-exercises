<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 8: Word and Character Counter</title>
    <style>
        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: #007BFF;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        .btn-back:hover { text-decoration: underline; }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 350px;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            resize: none; 
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background-color: #ecf0f1;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">← Back to home</a>

    <div class="container">
        <h2>Text Counter</h2>
        <textarea id="text-input" placeholder="Type or paste your paragraph here..."></textarea>
        
        <div class="stats">
            <div>Words: <span id="word-count">0</span></div>
            <div>Characters: <span id="character-count">0</span></div>
        </div>
    </div>

    <script src="js_exercise8.js"></script>
</body>
</html>
