<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6: Timer Application</title>
    <style>
        .btn-regresar {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: #007BFF;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        .btn-regresar:hover { text-decoration: underline; }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 320px;
            text-align: center;
        }
    
        #display {
            font-size: 42px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
            background-color: #ecf0f1;
            padding: 10px;
            border-radius: 4px;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        #btn-start { background-color: #2ecc71; }
        #btn-pause { background-color: #f39c12; }
        #btn-reset { background-color: #e74c3c; }
    </style>
</head>
<body>

    <a href="index.html" class="btn-regresar">← Volver al Índice</a>

    <div class="container">
        <h2>Chronometer</h2>
        <div id="display">00:00:00</div>
        <div class="controls">
            <button id="btn-start">Start</button>
            <button id="btn-pause">Pause</button>
            <button id="btn-reset">Reset</button>
        </div>
    </div>

    <script src="js_ejercicio6.js"></script>
</body>
</html>
